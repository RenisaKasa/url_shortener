<main>
  <a class="brand" routerLink="/login">↗ {{ text().common.brand }}.</a>
  <h1>{{ text().dashboard.heading }}</h1>
  <p>{{ copy.format(text().dashboard.welcome, { email: auth.user()?.email ?? '' }) }}</p>
  <p>{{ text().dashboard.description }}</p>
  <button type="button" (click)="logout()" [disabled]="loading()">{{ loading() ? text().dashboard.loggingOut : text().dashboard.logout }}</button>
  @if (error()) { <p role="alert">{{ error() }}</p> }
</main>
