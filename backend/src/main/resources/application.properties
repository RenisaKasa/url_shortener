spring.application.name=url-shortener

server.port=8081
# Support launching from either the monorepo root (IntelliJ) or backend/ (Maven).
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

# MySQL database connection
spring.datasource.url=jdbc:mysql://localhost:3306/url_shortener
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Set SESSION_COOKIE_SECURE=true behind HTTPS in production.
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
app.security.allowed-origin=${FRONTEND_ORIGIN:http://localhost:4200}
spring.data.web.pageable.max-page-size=100
spring.jpa.open-in-view=false

# Default lifetime for newly created links: 30 days.
app.urls.default-lifetime=P30D

# Background expiration processing.
app.urls.expiration.enabled=true
app.urls.expiration.check-interval=PT1M
app.urls.expiration.initial-delay=PT1M